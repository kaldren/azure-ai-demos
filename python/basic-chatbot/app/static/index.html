<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contoso Policy Chat</title>
  <style>
    :root { --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #667085; --accent: #2f5bea; --me: #e8eeff; --border: #e3e6ec; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111318; --panel: #1a1d24; --text: #e6e8ee; --muted: #9aa3b2; --accent: #7c9cff; --me: #232c45; --border: #2a2f3a; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; background: var(--bg); color: var(--text); }
    main { max-width: 760px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; height: 100dvh; }
    header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    h1 { font-size: 18px; margin: 0; }
    #meta { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    #log { flex: 1; overflow-y: auto; padding: 12px 0; display: flex; flex-direction: column; gap: 10px; }
    .msg { padding: 10px 12px; border-radius: 10px; background: var(--panel); border: 1px solid var(--border); white-space: pre-wrap; }
    .me { background: var(--me); align-self: flex-end; max-width: 85%; }
    .trace { margin-top: 6px; font-size: 12px; color: var(--muted); }
    .trace span { display: block; }
    .err { border-color: #d64545; }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--text); font: inherit; }
    button { padding: 10px 14px; border-radius: 8px; border: 0; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
    button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--border); }
    button:disabled { opacity: .5; cursor: default; }
    header > div { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
    #signout { color: var(--accent); }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Contoso policy assistant</h1>
    <div>
      <span id="user"></span>
      <!-- App Service authentication endpoint: clears the session cookie and signs out of Entra ID -->
      <a href="/.auth/logout?post_logout_redirect_uri=/" id="signout">Sign out</a>
      <button class="secondary" id="new" type="button">New conversation</button>
    </div>
  </header>
  <div id="meta">No conversation yet</div>
  <div id="log" aria-live="polite"></div>
  <form id="form">
    <input id="input" autocomplete="off" maxlength="2000" placeholder="Ask about travel, expenses or remote work…" required>
    <button id="send">Send</button>
  </form>
</main>
<script>
  // The browser keeps the Foundry conversation ID; the server stays stateless.
  const KEY = "conversation_id";
  const store = {
    get() { try { return sessionStorage.getItem(KEY); } catch { return null; } },
    set(v) { try { v ? sessionStorage.setItem(KEY, v) : sessionStorage.removeItem(KEY); } catch {} },
  };
  const $ = (id) => document.getElementById(id);

  function add(text, cls, trace) {
    const div = document.createElement("div");
    div.className = "msg " + (cls || "");
    div.textContent = text;
    if (trace && trace.length) {
      const t = document.createElement("div");
      t.className = "trace";
      for (const line of trace) { const s = document.createElement("span"); s.textContent = line; t.appendChild(s); }
      div.appendChild(t);
    }
    $("log").appendChild(div);
    $("log").scrollTop = $("log").scrollHeight;
  }

  function showMeta() {
    const id = store.get();
    $("meta").textContent = id ? "Conversation " + id : "No conversation yet";
  }

  $("new").onclick = () => { store.set(null); $("log").innerHTML = ""; showMeta(); };

  $("form").onsubmit = async (e) => {
    e.preventDefault();
    const message = $("input").value.trim();
    if (!message) return;
    add(message, "me");
    $("input").value = "";
    $("send").disabled = true;
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, conversation_id: store.get() }),
      });
      // An expired sign-in makes App Service answer with a redirect to the Entra login page,
      // which fetch can't follow cross-origin. Detect it instead of failing to parse JSON.
      if (res.redirected || !(res.headers.get("content-type") || "").includes("application/json")) {
        throw new Error("Your sign-in has expired. Reload the page to sign in again.");
      }
      const data = await res.json();
      if (res.status === 404) {
        store.set(null); showMeta();  // not found or not yours: start fresh
        throw new Error("That conversation isn't available. Your next message starts a new one.");
      }
      if (!res.ok) throw new Error(data.detail || res.statusText);
      store.set(data.conversation_id);
      showMeta();
      const trace = [
        ...(data.searches.length ? data.searches.map((q) => "🔎 searched: " + q) : ["no search"]),
        ...data.citations.map((c) => "📄 cited: " + c),
        `${data.agent} · tokens in/out ${data.input_tokens}/${data.output_tokens}`,
      ];
      add(data.answer, "", trace);
    } catch (err) {
      add("Error: " + err.message, "err");
    } finally {
      $("send").disabled = false;
      $("input").focus();
    }
  };
  showMeta();
  fetch("/api/me").then((r) => r.ok ? r.json() : null).then((me) => {
    if (me) $("user").textContent = "Signed in as " + me.name;
  }).catch(() => {});
</script>
</body>
</html>
